<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>No existe · PocketVault</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: 'Cabinet Grotesk'; src: url('/fonts/cabinet-grotesk-var.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: 'Boska'; src: url('/fonts/boska-italic-400.woff2') format('woff2'); font-style: italic; font-display: swap; }
    :root { --bg: oklch(0.155 0.006 70); --text: oklch(0.948 0.012 85); --text-2: oklch(0.775 0.016 80); --accent: oklch(0.765 0.102 80); --line: oklch(0.44 0.072 78); }
    * { margin: 0; box-sizing: border-box; }
    body { min-height: 100dvh; display: grid; place-content: center; gap: 20px; padding: 24px; background: var(--bg); color: var(--text); font: 450 15px/1.5 'Cabinet Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .mark { font-size: 20px; font-weight: 800; letter-spacing: -0.045em; }
    .mark em { font-family: 'Boska', Georgia, serif; font-weight: 400; color: var(--accent); }
    h1 { font-size: 39px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.1; max-width: 16ch; }
    p { color: var(--text-2); max-width: 44ch; }
    a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; text-decoration-color: var(--line); }
  </style>
</head>
<body>
  <p class="mark">Pocket<em>Vault</em></p>
  <h1>Aquí no hay nada guardado.</h1>
  <p>Esta dirección no existe. Si buscabas algo que subiste hace más de 7 días sin fijarlo, ya se ha borrado.</p>
  <p><a href="/">Volver a tu bóveda</a></p>
</body>
</html>
